name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Bootstrap-safe install: a package's @geniusventures/* cross-deps may not be
      # published yet, and this repo may have no committed lockfile. Strip our own
      # scoped deps (peers/devDeps used only for local dev, not for emitting dist/)
      # so `npm install` never 404s on an unpublished sibling.
      - name: Install dependencies (excluding unpublished @geniusventures/* cross-deps)
        run: |
          cp package.json /tmp/package.json.orig
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            for (const sec of ['dependencies','devDependencies','peerDependencies','optionalDependencies']) {
              if (!pkg[sec]) continue;
              for (const name of Object.keys(pkg[sec])) {
                if (name.startsWith('@geniusventures/')) delete pkg[sec][name];
              }
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          npm install --legacy-peer-deps --no-audit --no-fund
          cp /tmp/package.json.orig package.json

      # Build dist/ explicitly. The packages' own prepublishOnly hooks invoke
      # yarn (not configured on npm install) and run test+lint, so we publish
      # with --ignore-scripts and build here instead.
      - name: Build
        run: npx tsc --build --force || npx tsc

      # diamonds-hardhat-foundry ships dist/templates copied from src/templates.
      - name: Copy build assets (if present)
        run: |
          if [ -d src/templates ]; then
            mkdir -p dist/templates && cp src/templates/*.template dist/templates/
          fi

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
