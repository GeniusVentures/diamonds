name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance attestation

# CROSS_DEPS: space-separated @geniusventures/* packages this package imports at
# COMPILE time. They are installed from npm before building, so they must already
# be published (publish in dependency order). Dev-only @geniusventures/* deps are
# stripped so a not-yet-published sibling never 404s the install.
env:
  CROSS_DEPS: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Trusted publishing: no registry-url (avoids a stale NODE_AUTH_TOKEN
      # .npmrc line overriding OIDC), no token env. Node 24 + npm >=11.5.1
      # publish with GitHub OIDC via `npm publish --provenance`.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Update npm for OIDC trusted publishing
        run: npm install -g npm@^11.5.1

      # package.json pins yarn@4.10.3 via packageManager; publish lifecycle
      # scripts (prepublishOnly: yarn build) need corepack to resolve it.
      - name: Enable corepack
        run: corepack enable

      # Strip @geniusventures/* dev-deps (used only for local dev / the publish
      # cycle) so `npm install` resolves. Compile-time cross-deps are installed
      # explicitly in the next step.
      - name: Install dependencies
        run: |
          cp package.json /tmp/package.json.orig
          node -e "
            const fs = require('fs');
            const keep = (process.env.CROSS_DEPS || '').split(/\s+/).filter(Boolean);
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            for (const sec of ['dependencies','devDependencies','peerDependencies','optionalDependencies']) {
              if (!pkg[sec]) continue;
              for (const name of Object.keys(pkg[sec])) {
                if (name.startsWith('@geniusventures/') && !keep.includes(name)) delete pkg[sec][name];
              }
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          npm install --legacy-peer-deps --no-audit --no-fund
          if [ -n "${CROSS_DEPS}" ]; then
            npm install --no-save --legacy-peer-deps --no-audit --no-fund ${CROSS_DEPS}
          fi
          cp /tmp/package.json.orig package.json
        env:
          CROSS_DEPS: ${{ env.CROSS_DEPS }}

      # These packages carry pre-existing TS strictness errors (e.g. hre.ethers)
      # that do not prevent emit. Build, then verify dist/ was produced.
      - name: Build (emit despite pre-existing TS noise)
        run: |
          npx tsc --build --force || npx tsc || true
          if [ ! -d dist ]; then
            echo "Build produced no dist/ output"
            exit 1
          fi

      # diamonds-hardhat-foundry ships dist/templates copied from src/templates.
      - name: Copy build assets (if present)
        run: |
          if [ -d src/templates ]; then
            mkdir -p dist/templates && cp src/templates/*.template dist/templates/
          fi

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # NOTE: no --ignore-scripts — with it, npm's provenance path tries to
      # create an access token (needs prior auth) instead of using OIDC
      # trusted publishing (npm/cli#8548).
      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --provenance --access public
        env:
          # 'prepare: husky' runs during publish and exits 1 when the husky
          # binary can't be found in the stripped dev-dep tree.
          HUSKY: 0
